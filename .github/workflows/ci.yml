name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: gateway/web/dist
          retention-days: 1

  gateway:
    name: gateway build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: arcnode-gateway-linux-amd64
            ext: ""
          - os: macos-latest
            artifact: arcnode-gateway-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: arcnode-gateway-windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: gateway/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: gateway/web/dist
      - run: go vet ./...
        working-directory: gateway
      - name: build release binary
        working-directory: gateway
        run: go build -trimpath -ldflags="-s -w" -o arcnode-gateway${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            gateway/arcnode-gateway${{ matrix.ext }}
            gateway/config.example.toml
          retention-days: 14

  agent:
    name: agent build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: arcnode-agent-linux-amd64
            ext: ""
          - os: macos-latest
            artifact: arcnode-agent-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: arcnode-agent-windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxss-dev libxtst-dev
      - name: build release binary
        run: cargo build --workspace --release
        env:
          CARGO_TERM_COLOR: always
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/arcnode-agent${{ matrix.ext }}
            config.example.toml
          retention-days: 14
