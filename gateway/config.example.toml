# ArcNode Gateway 配置

listen = ":8080"
token = "change-me-to-a-secure-token"
db_path = "./gateway.db"

# 时间线分段合并阈值（秒），相邻事件间隔小于此值视为同一段
segment_gap_seconds = 60

# 数据保留天数。0（默认）= 永久保留；设为正数后，网关启动时及之后每 24h
# 自动清理早于该窗口的 events/segments 并 VACUUM 回收空间，控制库体积。
retention_days = 0

# ============================================================
# 分类规则
# 内置规则已覆盖主流 IDE / 终端 / 游戏 / 浏览器 / IM 等，启动时
# 会与下面的用户自定义条目合并。在前端「设置」页面也可以可视化
# 增删，无需重启网关。
#
# 分类匹配优先级：
#   1. 先按 process_name 命中（精准，不会被窗口标题污染）
#   2. 若 process 命中的是 browsing（浏览器），再用 title 关键字
#      尝试升级为更具体的分类（例如 youtube → video）
#
# v2 推荐写法（按 scope 拆开）：
# ============================================================
[category_rules.coding]
process = ["kiro.exe", "code-server"]
title   = []

[category_rules.video]
process = []
title   = ["bilibili.com", " - youtube"]

# 兼容旧写法（所有条目当作 process keyword 追加到对应分类）
# [categories]
# coding = ["my-custom-ide"]
# gaming = ["my-game.exe"]
