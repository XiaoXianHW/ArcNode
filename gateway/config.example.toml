    "chrome", "firefox", "edge", "safari", "brave", "opera", "arc",
    "vivaldi", "tor browser"
]
productivity = [
    "notion", "obsidian", "logseq", "evernote", "onenote", "bear",
    "word", "excel", "powerpoint", "keynote", "pages", "numbers",
    "figma", "sketch", "adobe", "photoshop", "illustrator", "indesign",
    "blender", "unity", "unreal"
